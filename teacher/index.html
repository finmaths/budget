<script>

/* online: every /api/ call goes to api.php with this class's key */
(function(){const API='https://budget.lungjyi.net/api.php',RK='y10-budget-room',of=window.fetch.bind(window);
const SITE=new URL('../',location.href).href.replace(/\/$/,'');
let room=null;try{room=JSON.parse(localStorage.getItem(RK)||'null');}catch(e){}
let making=null;
function make(){if(!making)making=of(API+'?p=/api/new',{method:'POST'}).then(r=>r.json()).then(j=>{if(!j.room)throw new Error(j.error||'No class');room=j;try{localStorage.setItem(RK,JSON.stringify(j));}catch(e){}return j;}).finally(()=>{making=null;});return making;}
window.fetch=async function(u,o){if(typeof u!=='string'||!u.startsWith('/api/'))return of(u,o);o=Object.assign({},o||{});
  for(let k=0;k<2;k++){if(!room)await make();
    const r=await of(API+'?p='+encodeURIComponent(u),Object.assign({},o,{headers:Object.assign({},o.headers||{},{'X-Room':room.room,'X-Token':room.token,'X-Site':SITE})}));
    if(r.status===401&&k===0){room=null;try{localStorage.removeItem(RK);}catch(e){}continue;}
    return r;}};
})();
'use strict';
/* ===== Figures (see README for where each one comes from) ===== */
const BANK = 3751;
const PRESETS = [
  ['Rent',3380,'f'],['Groceries',500,'d'],['Electricity',120,'d'],['Internet',80,'f'],['Phone plan',50,'f'],
  ['Transport',220,'d'],['Clothes',100,'d'],['Streaming',20,'f'],['Eating out',300,'d'],['Going out',200,'d'],['Gym',60,'f'],['Haircuts',40,'d']
];
/* 'f' = fixed, 'd' = variable. Items typed in with Other have no set answer, so either bin is accepted. */
const answerOf=(n)=>{const p=PRESETS.find(x=>x[0]===n);return p?p[2]:null;};
/* Strict JSON between the markers: server.py reads ITEMS and SURPRISE. */
/*ITEMS*/ const ITEMS = [
  {"key": "housing", "label": "Rent", "opts": ["Share house", "Own unit"], "weekly": [400, 600]},
  {"key": "electricity", "label": "Electricity", "byHousing": [75, 150]},
  {"key": "transport", "label": "Getting around", "opts": ["I walk or ride a bike", "I take the bus and train", "I drive my own car (petrol, rego, insurance)"], "prices": [0, 50, 250]},
  {"key": "groceries", "label": "Groceries", "opts": ["I compare prices and buy the best deal", "I buy whatever I like", "I’m a shopaholic"], "prices": [250, 400, 650]},
  {"key": "takeaway", "label": "Takeaway and eating out", "opts": ["I cook all my meals", "I get takeaway on weekends", "I eat out almost every day"], "prices": [40, 160, 500]},
  {"key": "coffee", "label": "Coffee and snacks", "opts": ["I don’t drink coffee or eat sweets", "I treat myself a few times a week", "I must have a coffee every day"], "prices": [0, 50, 130]},
  {"key": "phone", "label": "Phone plan", "opts": ["I just need calls and a little data", "I use a lot of data", "I want unlimited data and the newest phone"], "prices": [20, 45, 110]},
  {"key": "internet", "label": "Internet", "opts": ["Slow is fine, I want it cheap", "I need fast internet"], "prices": [60, 100]},

 say:['A $6 coffee, every weekday. How much is that in a year? 〔等，點名〕〔點〕$6 times 5 times 52 is $1,560.','How much is that per month? 〔點〕$130. That is one line in your budget you never planned for.'],
 view:(st)=>`<p class="mid" style="font-size:66px;font-weight:700">$6 coffee, every weekday</p><div style="height:70px"></div>${ask('How much in a year?','$6 × 5 × 52 = $1,560',st>=1)}${ask('How much per month?','$1,560 ÷ 12 = $130',st>=2)}`},
{id:'activity',title:'Activity time',steps:0,
 say:['Activity time. You are going to live one month on $3,751. Let\u2019s see who can keep their budget under control.'],
 view:()=>``},
{id:'scenario',title:'Scenario',steps:0,
 say:['Here is the scenario. You have just finished high school and started uni. You have moved out of home, so you have to pay for everything yourself. You have $3,751 a month. Rent is $400 a week in a share house, or $600 a week in your own unit. Electricity is $75 a month in a share house, or $150 on your own.'],
 view:()=>`<div class="scn"><p>You have just finished high school, started uni and moved out of home.</p><p>You pay for everything yourself.</p><p>Money in the bank each month: <b>$3,751</b></p><p>Rent: share house <b>$400</b> a week, own unit <b>$600</b> a week.</p><p class="sm">Electricity: $75 a month in a share house, $150 a month in your own unit.</p></div>`},
{id:'join',title:'Join your group',steps:0,
 say:['One laptop per group. Only one person logs in. Type this address, then enter your group code. 〔等每組都打勾；有組換電腦就點那組的卡片放開〕'],
 view:()=>{const sets=`<div class="sets">${ctl('Groups','nGroups',[2,3,4,5,6,7,8,9,10])}</div>`;
  if(!ONLINE||!NET.address)return sets+`<p class="mid">Laptops are not connected. Press Next and enter each group’s slip and costs on this screen.</p>`;
  let r='';for(let g=0;g<S.nGroups;g++)r+=`<button class="jg" ${NET.seen.includes(g)?`data-release="${g}" title="Click to let another laptop join"`:'disabled'}><span>Group ${g+1}</span><b>${NET.join[g]||''}</b><i>${NET.seen.includes(g)?'✓':''}</i></button>`;
  if(!NET.tunnel&&NET.tunnelStarting)return sets+`<p class="mid">Getting the website ready… (about a minute)</p>`;
  return sets+(NET.tunnel?`<p class="lead"><b style="color:var(--red)">One laptop per group.</b> Type this address:</p>${urlBig(NET.tunnel)}`:`<p class="lead">Type this address</p><div class="big" style="font-size:104px">${NET.address}</div>`)+`<div class="jgs" style="margin-top:24px">${r}</div>`}},
{id:'setup',title:'Plan your month',steps:0,
 say:['In this bucket are incidents. Some are good, some are bad. Just like life, you don\u2019t know what is going to happen. One person from each group, come and draw a slip, then type the code on your laptop. 〔等每組卡片都出現 Slip〕','You have eight minutes to plan your month. Your income is $3,751, plus or minus your incident. Estimate what everything costs for one month, and work out yourself how much money is left. Be careful: keep your budget under control! 〔按 Start 8 minutes〕','〔剩 2:00 布幕跳出全體意外：每組都 −$600〕Something urgent just happened. Cut something from your budget now!','〔時間到自動鎖定；點各組卡片看預算，再按 Next〕'],
 view:()=>{if(viaLaptops())return setupOnline();
  let r='';for(let g=0;g<S.nGroups;g++){const L=leftOf(g);r+=`<div class="gc${L==null?'':' done'}"><h4>Group ${g+1}</h4><label class="cost">Costs $<input type="number" min="0" data-cost="${g}" value="${S.costs[g]==null?'':S.costs[g]}"></label><b class="${L==null?'':L<0?'neg':'pos'}">${L==null?'':'Left '+sgn(L)}</b></div>`;}
  return `<div class="sets"><span>Income: <b>$3,751</b></span><span style="flex:1"></span>${phaseNow()!=='wait'?'<button class="mini more" data-more="1">+1 minute</button>':''}${ONLINE&&NET.address?'<button class="mini" data-manual="0">Use laptops</button>':''}</div>${timerBanner()}<p class="mid" style="font-size:30px;margin:0 0 12px">Type each group\u2019s total costs.</p><div class="gcs">${r}</div>${msg?`<p class="warn">${msg}</p>`:''}`}},
{id:'game',title:'What happened to each group',steps:0,
 say:['Here is what happened to every group. Some were good, some were bad. Just like life, you don\u2019t know what is going to happen.','〔沒輸入代碼的組，在下面按他的代碼補上〕'],
 view:()=>{const w=waiting(),done=!w.length;const used=new Set(S.log.map(l=>l.code));
  let c='';for(let i=0;i<S.nGroups;i++){const e=S.log.find(l=>l.g===i);
   c+=`<div class="card${w.includes(i)?' now':''}${flashG===i?' flash':''}"><h4>Group ${i+1}</h4>${e?`<div class="inc">${e.t}</div><div class="bal ${e.a<0?'neg':'pos'}">${plus(e.a)}</div>`:'<div class="inc wait">Waiting for a slip\u2026</div>'}</div>`;}
  let pad='';INCIDENTS.forEach(x=>pad+=`<button data-n="${x.code}" ${used.has(x.code)||done?'disabled':''}>${x.code}</button>`);
  return `<div class="cards">${c}</div><div class="turn"><span>${done?'Every group has a slip':`Waiting for Group ${w.map(g=>g+1).join(', ')}`}</span><span>${done?'':'<button id="rand">No slip: draw for me</button>'}<button id="undo" ${S.log.length?'':'disabled'}>Undo</button></span></div><div class="pad">${pad}</div>`}},
{title:'Who made it through the month?',steps:1,
 say:['Who still has money? Who is in debt?','If you could start the month again, what would you cut first? 〔點名〕〔點〕Choosing what to cut before the month starts is what a budget is for.'],
 view:(st)=>{const a=[];for(let i=0;i<S.nGroups;i++)a.push([i,leftOf(i)]);a.sort((x,y)=>(y[1]??-1e9)-(x[1]??-1e9));
  return `<div class="rank">${a.map(([g,b])=>`<div><span>Group ${g+1}</span><b class="${b==null?'':b<0?'neg':'pos'}">${b==null?'\u2013':sgn(b)}</b></div>`).join('')}</div>${ask('Start again: what would you cut first?','&nbsp;',false)}<p class="mid${vis(st>=1)}" style="font-weight:700">Make your choices before the month starts.</p>`}}
];

/* ===== Print views ===== */
const q=location.search;
if(q==='?slips'){
  document.documentElement.classList.add('print');document.body.classList.add('print');
  const out=document.createElement('div');out.className='slipgrid';
  out.innerHTML=INCIDENTS.map(c=>`<div class="slipc"><b>${c.code}</b></div>`).join('');
  document.getElementById('fit').replaceWith(out);
}else if(q==='?plan_sheet'){
  document.documentElement.classList.add('print');document.body.classList.add('print');
  const rows=ITEMS.map(it=>`<tr><td class="lb">${it.label}</td><td class="op">${it.byHousing?`Share house $${it.byHousing[0]} \u00b7 Own unit $${it.byHousing[1]}`:(it.opts||[]).map((o,n)=>`<span>${o} <b>$${it.weekly?Math.round(it.weekly[n]*52/12).toLocaleString('en-AU'):it.prices[n]}</b></span>`).join('')}</td><td class="amt">$</td></tr>`).join('');
  const one=`<div class="ps pss"><div class="sh"><b>Plan your month</b><span>Group:</span></div>
  <p class="pq">You have just finished high school, started uni and moved out of home. Income this month: <b>$3,751</b></p>
  <table class="pst"><tr><th>Item</th><th>Circle one</th><th>Cost a month</th></tr>
  ${rows}
  <tr class="tot"><td class="lb">Your incident</td><td class="op"><span class="hint">Slip code:</span></td><td class="amt">$</td></tr>
  <tr class="tot"><td class="lb">Surprise</td><td class="op"><span class="hint">Your teacher will tell you.</span></td><td class="amt">$</td></tr>
  <tr class="tot"><td class="lb">Money left</td><td class="op"><span class="hint">Calculate it yourself. Be careful: keep your budget under control!</span></td><td class="amt">$</td></tr></table></div>`;
  const out=document.createElement('div');out.className='starter-sheet';out.innerHTML=one;
  document.getElementById('fit').replaceWith(out);
}else if(q==='?starter'||q==='?starter_ans'){
  document.documentElement.classList.add('print');document.body.classList.add('print');
  const ans=q==='?starter_ans';
  const one=`<div class="slip2"><div class="sh"><b>Starter</b><span>Name:</span></div>${STARTER_Q.map(t=>`<p class="pq">${t}</p>`).join('')}${taxTable(-1)}<div class="pw">${ans?STARTER_A.map(t=>`<p>${t}</p>`).join(''):''}</div></div>`;
  const out=document.createElement('div');out.className='starter-sheet';out.innerHTML=one+one;
  document.getElementById('fit').replaceWith(out);
}else if(q==='?script'){
  document.documentElement.classList.add('print');document.body.classList.add('print');
  const out=document.createElement('div');
  out.className='script';
  out.innerHTML='<h1>y10 Budget — Script</h1>'+SCENES.map((s,i)=>`<h2>${i+1}. ${s.title}</h2>`+s.say.map(l=>`<p>${l}</p>`).join('')).join('')
   +'<h2 style="margin-top:6mm">Slip codes (teacher only)</h2><div class="key">'+INCIDENTS.map(c=>`<p><b>${c.code}</b> ${c.t} ${plus(c.a)}</p>`).join('')+'</div>';
  document.getElementById('fit').replaceWith(out);
}else{
/* ===== Run ===== */
const stage=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${k})`;}
addEventListener('resize',fit);fit();
function render(){
  const sc=SCENES[S.s];
  stage.innerHTML=(sc.id==='activity'?`<div class="act"><h1>Activity time</h1><p>Life Happens: can you control your budget?</p></div>`:sc.id==='cover'?`<div class="cover"><h1>Budgeting</h1><i></i><p>Planning where your money goes</p><small>Year 10</small></div>`:`<div class="bar"><span>${sc.title}</span><span class="tmr" id="tmr"></span></div><div class="body">${sc.view(S.step)}</div>`)+`
  <div class="nav"><button id="back">← Back</button><button class="go" id="next">Next →</button><span class="count">${S.s+1} / ${SCENES.length}</span><span class="sp"></span><button id="fs">Full screen</button><button id="reset">Reset</button></div>${modal!==null?modalHtml():''}`;
  if(sc.after)sc.after(S.step);
  flashG=-1;save();tick();
}
let lastPhase=null;
function tick(){const t=document.getElementById('tmr');const ph=phaseNow();
  if(t){t.textContent=clockText();t.className='tmr'+(ph==='surprise'||ph==='over'?' warn':'');}
  if(ph!==lastPhase){const was=lastPhase;lastPhase=ph;const id=SCENES[S.s].id;
    if(was==='plan'&&ph==='surprise'&&id==='setup'&&modal===null){modal={sur:true};}
    if(was!==null&&(id==='setup'||id==='game')&&(modal===null||modal.sur))render();}}
setInterval(tick,250);
function modalHtml(){
  if(modal.sur)return `<div class="modal"><div class="sheet surp"><h2>Surprise for every group!</h2><p>${SURPRISE.t}</p><div class="amt neg">${plus(SURPRISE.a)}</div><p>Cut something from your budget now!</p><div class="bt"><button class="go" id="close">Close</button></div></div></div>`;
  if(modal.detail!==undefined){const g=modal.detail,p=(NET.plans||{})[g],e=S.log.find(l=>l.g===g);
    const rows=ITEMS.map(it=>`<div class="dr"><span>${it.label}${it.opts&&p.picks[it.key]!=null?': '+it.opts[p.picks[it.key]]:''}</span><b>${$(p.amounts[it.key]||0)}</b></div>`).join('');
    return `<div class="modal"><div class="sheet detail"><h2>Group ${g+1}</h2><div class="dlist"><div class="dr"><span>Income</span><b>$3,751</b></div>${e?`<div class="dr"><span>${e.t}</span><b>${plus(e.a)}</b></div>`:''}${surpriseOn()?`<div class="dr"><span>${SURPRISE.t}</span><b>${plus(SURPRISE.a)}</b></div>`:''}${rows}</div><div class="dr end"><span>Money left</span><b class="${p.left<0?'neg':'pos'}">${sgn(p.left)}</b></div><div class="bt"><button class="go" id="close">Close</button></div></div></div>`;}
  if(modal.show){const e=modal.show;return `<div class="modal"><div class="sheet"><h2>Group ${e.g+1} · Slip ${e.code}</h2><p>${e.t}</p><div class="amt ${e.a<0?'neg':'pos'}">${plus(e.a)}</div><div class="bt"><button class="go" id="close">Close</button></div></div></div>`;}
  const g=waiting()[0],c=incidentFor(modal,g);
  return `<div class="modal"><div class="sheet"><h2>Group ${g+1} · Slip ${modal}</h2><p>Lock in slip ${modal} for Group ${g+1}?</p><div class="bt"><button id="cancel">Cancel</button><button class="go" id="apply">Lock in</button></div></div></div>`;}
async function api(p,b){try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return await r.json();}catch(e){return null;}}
function pushSetup(reset){if(ONLINE)api('/api/setup',{nGroups:S.nGroups,log:S.log,reset:!!reset});}
const queue=[];
function showNext(){if(modal===null&&queue.length){const e=queue.shift();modal={show:e};flashG=e.g;render();}}
async function poll(){let r;try{r=await (await fetch('/api/state')).json();}catch(e){return;}
  const before=JSON.stringify([NET.seen,NET.address,NET.tunnel,NET.tunnelStarting,NET.join,S.log,NET.plans]);
  if(r.log.length>S.log.length)flashG=r.log[r.log.length-1].g;
  NET=r;NET.at=Date.now();S.log=r.log;
  const id=SCENES[S.s].id;
  if(before!==JSON.stringify([NET.seen,NET.address,NET.tunnel,NET.tunnelStarting,NET.join,S.log,NET.plans])&&(id==='join'||id==='setup'||id==='game')&&modal===null)render();
  showNext();}
function next(){if(modal!==null)return;const sc=SCENES[S.s];
  if(S.step<sc.steps){S.step++;render();return;}
  if(sc.id==='setup'&&!viaLaptops()){const g=ready();if(g>=0){msg=`Group ${g+1} has not finished choosing.`;render();return;}msg='';pushSetup();}
  if(S.s<SCENES.length-1){S.s++;S.step=0;prevBoss=false;render();}}
function back(){if(modal!==null)return;msg='';if(S.step>0){S.step--;render();return;}
  if(S.s>0){S.s--;S.step=SCENES[S.s].steps;prevBoss=SCENES[S.s].id==='minwage';render();}}
async function apply(){const g=waiting()[0],code=modal;modal=null;let e;
  if(ONLINE){const r=await api('/api/teacher',{g,code});if(r){NET=r;S.log=r.log;e=S.log[S.log.length-1];}}
  else{const c=incidentFor(code,g);e={g,code,t:c.t,a:c.a};S.log.push(e);}
  if(e)flashG=g;render();}
stage.addEventListener('click',async(e)=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(t.id==='next')return next();if(t.id==='back')return back();
  if(t.id==='close'){modal=null;render();return showNext();}
  if(t.id==='fs'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();return;}
  if(t.id==='reset'){if(confirm('Clear everything and go back to the start?')){S=fresh();NET.remaining=null;modal=null;msg='';prevBoss=false;queue.length=0;if(ONLINE)await api('/api/reset');pushSetup(true);render();}return;}
  if(t.id==='apply')return apply();if(t.id==='cancel'){modal=null;return render();}
  if(t.id==='undo'){if(ONLINE){const r=await api('/api/undo');if(r){NET=r;S.log=r.log;}}else S.log.pop();return render();}
  if(t.id==='rand'){const used=new Set(S.log.map(l=>l.code));const left=INCIDENTS.map(x=>x.code).filter(c=>!used.has(c));modal=left[Math.floor(Math.random()*left.length)];return render();}
  if(d.pre!==undefined){const p=PRESETS[+d.pre];S.items.push({n:p[0],a:null});return render();}
  if(d.del!==undefined){const it=S.items.splice(+d.del,1)[0];delete S.sorted[it.n];return render();}
  if(d.f!==undefined||d.d!==undefined){const n=d.f!==undefined?d.f:d.d,pick=d.f!==undefined?'f':'d',ans=answerOf(n);
    if(ans&&ans!==pick){wrongItem=n;rightItem=null;return render();}
    S.sorted[n]=pick;wrongItem=null;rightItem=n;render();rightItem=null;return;}
  if(d.un!==undefined){delete S.sorted[d.un];return render();}
  if(d.release!==undefined){if(confirm('Let another laptop join Group '+(+d.release+1)+'?')){const r=await api('/api/release',{g:+d.release});if(r){NET=r;NET.at=Date.now();}render();}return;}
  if(d.detail!==undefined){modal={detail:+d.detail};return render();}
  if(d.timer!==undefined){if(ONLINE&&NET.address){const r=await api('/api/timer',{seconds:GAME_SECONDS});if(r){NET=r;NET.at=Date.now();}}else{S.tEnd=Date.now()+GAME_SECONDS*1000;S.surprised=false;}lastPhase=null;return render();}
  if(d.more!==undefined){if(ONLINE&&NET.address){const r=await api('/api/timer',{add:60});if(r){NET=r;NET.at=Date.now();}}else if(S.tEnd){S.tEnd=Math.max(S.tEnd,Date.now())+60000;}lastPhase=null;return render();}
  if(d.manual!==undefined){S.manual=d.manual==='1';pushSetup();return render();}
  if(d.k!==undefined){(S.picks[d.g]=S.picks[d.g]||{})[d.k]=+d.v;msg='';pushSetup();return render();}
  if(d.set!==undefined){if(S.log.length&&!confirm('This restarts the game. Continue?'))return;S.log=[];S[d.set]=+d.val;pushSetup(true);return render();}
  if(d.n!==undefined){modal=d.n;return render();}
});
stage.addEventListener('change',(e)=>{const c=e.target.dataset.cost;if(c!==undefined){S.costs[+c]=e.target.value===''?null:Math.max(0,+e.target.value);msg='';return render();}
  const i=e.target.dataset.amt;if(i!==undefined){S.items[+i].a=e.target.value===''?null:Math.max(0,+e.target.value||0);save();}});
stage.addEventListener('submit',(e)=>{e.preventDefault();const n=document.getElementById('nm').value.trim();const a=+document.getElementById('am').value||0;
  if(!n||S.items.some(x=>x.n===n))return;S.items.push({n,a});render();const f=document.getElementById('nm');if(f)f.focus();});
addEventListener('keydown',(e)=>{const tag=(e.target.tagName||'');if(tag==='INPUT')return;
  if(modal!==null){if(modal.show||modal.sur||modal.detail!==undefined){if(e.key==='Enter'||e.key===' '){e.preventDefault();modal=null;render();showNext();}return;}if(e.key==='Enter'){e.preventDefault();apply();}if(e.key==='Escape'){modal=null;render();}return;}
  if([' ','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();next();}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}
  if(e.key==='f'){document.getElementById('fs').click();}
});
render();
if(ONLINE){pushSetup();poll();setInterval(poll,1000);}
}
</script>
